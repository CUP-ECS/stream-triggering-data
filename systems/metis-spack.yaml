# METIS for aCG on Tuolumne, through a Spack environment (Frontier uses `module load metis`).
# Adapted from Derek's earlier notes, which used cce@20.0.0. METIS is plain C, so any C compiler
# works; this one matches the stack's CCE. Change it if Spack doesn't know it.
#
#   spack env create st-metis systems/metis-spack.yaml
#   spack -e st-metis concretize && spack -e st-metis install
#   mkdir -p <prefix>/metis && cp -r "$(spack location -e st-metis)/.spack-env/view/." <prefix>/metis/
#
# build-scripts/build.sh then finds it at <prefix>/metis (or set METIS_DIR). aCG's default index
# size is 32-bit, which matches metis's default (no +int64).
spack:
  packages:
    c:
      require: [cce@21.0.3]
    cxx:
      require: [cce@21.0.3]
    fortran:
      require: [cce@21.0.3]
  specs:
  - matrix:
    - ["metis+shared"]
  view: true
